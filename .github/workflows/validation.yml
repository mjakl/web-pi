name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A CI host fixture, not a pinned product SDK dependency.
  PI_FIXTURE_VERSION: 0.86.1

jobs:
  source:
    name: Source validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
      - name: Install host Pi outside the checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/host-pi" --ignore-scripts --no-audit --no-fund \
            "@earendil-works/pi-coding-agent@$PI_FIXTURE_VERSION"
          echo "$RUNNER_TEMP/host-pi/node_modules/.bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/validation-home" "$RUNNER_TEMP/validation-agent"
          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/validation-agent" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Build, validate sources, and smoke-test the installed tarball on Node 24
        run: HOME="$RUNNER_TEMP/validation-home" just ci
