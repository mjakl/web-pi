name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    name: Source validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: validation-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
      # Job-level env cannot read runner.temp. One HOME for the install and
      # just ci also gives them one pnpm store.
      - name: Isolate validation from user Pi data
        run: |
          mkdir -p "$RUNNER_TEMP/validation-home" "$RUNNER_TEMP/validation-agent"
          echo "HOME=$RUNNER_TEMP/validation-home" >> "$GITHUB_ENV"
          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/validation-agent" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Build, validate sources, and smoke-test the installed tarball on Node 24
        run: just ci
      # The build refreshes Pi to stable latest, so the run may have tested a
      # newer Pi than the commit pins.
      - name: Report a Pi refresh
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(git diff --name-only -- package.json pnpm-lock.yaml)" ]; then
            echo "::warning title=Pi refreshed::The build changed package.json or pnpm-lock.yaml, so this run tested a newer Pi than the commit pins. Run just build and commit both files."
          fi
